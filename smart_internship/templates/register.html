<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartIntern - Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='auth.css') }}">

</head>


<body>

<div class="auth-page">

    <div class="auth-container">

        <!-- LEFT SIDE -->

        <div class="auth-left">

            <div class="left-content">

                <h1>
                    Join <br>
                    <span>SmartIntern</span>
                </h1>

                <p>
                    Create your account and discover
                    internship opportunities that match
                    your skills and interests.
                </p>

            </div>


            <!-- Decorative shapes -->

            <div class="shape shape-one"></div>

            <div class="shape shape-two"></div>

            <div class="shape shape-three"></div>

            <div class="shape shape-four"></div>

            <div class="shape shape-five"></div>

            <div class="shape shape-six"></div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="auth-right">

            <div class="form-container register-form">

                <h2>
                    CREATE ACCOUNT
                </h2>


                <form method="POST"
                      action="{{ url_for('register') }}">


                    <!-- NAME -->

                    <div class="input-box">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            name="name"
                            placeholder="Full Name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="input-box">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            type="email"
                            name="email"
                            placeholder="Email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="input-box">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            name="password"
                            id="registerPassword"
                            placeholder="Password"
                            required
                        >

                        <span
                            class="password-eye"
                            onclick="toggleRegisterPassword()">

                            👁

                        </span>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="input-box">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            name="confirm_password"
                            placeholder="Confirm Password"
                            required
                        >

                    </div>


                    <!-- CREATE BUTTON -->

                    <button
                        type="submit"
                        class="auth-button">

                        CREATE ACCOUNT

                    </button>


                </form>


                <!-- LOGIN -->

                <p class="account-text">

                    Already have an account?

                    <a href="{{ url_for('login') }}">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>


<script>

function toggleRegisterPassword() {

    const password =
        document.getElementById("registerPassword");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>

</body>

</html>
